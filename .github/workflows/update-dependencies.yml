name: Update dependencies

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dependencies
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Update vendored dependencies
        run: python3 scripts/update_dependencies.py

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install CSS purge tooling
        run: npm ci

      - name: Subset CSS (purge unused rules)
        run: npm run purge

      - name: Bundle vendor CSS
        run: npm run bundle-vendor

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore: update vendored front-end dependencies'
          title: 'chore: update vendored front-end dependencies'
          branch: update/dependencies
          delete-branch: true
          body: |
            Automated update of the locally-hosted third-party assets:
            - Font Awesome 7
            - highlight.js 11
            - Simple Jekyll Search
            - MathJax 4
            - Bootstrap 5
            - Google Fonts (Open Sans, Montserrat, Anonymous Pro — latin subset only)
